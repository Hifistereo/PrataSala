<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prāta Piedzīvojumu Sala - bērnu attīstības mini spēļu sala"
    />
    <title>Prāta Piedzīvojumu Sala</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        overflow-x: hidden;
        background: #dceaf7;
      }

      body {
        min-width: 320px;
      }

      .boot-error {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #34245c;
        font: 800 18px/1.35 system-ui, sans-serif;
        text-align: center;
      }

      /* The design board wraps the playable phone in a page of annotations.
         index.html keeps only the phone; these rules restyle the surviving
         nodes for a full-screen app, keyed off the data-app hooks in
         "Prata Sala.dc.html". */
      [data-app="page"] {
        min-height: 100dvh;
        padding: 16px;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: "Nunito", sans-serif;
        background: radial-gradient(
          circle at 20% 0%,
          #eaf6ff,
          #dceaf7 40%,
          #d3e0f0 100%
        );
      }

      [data-app="frame"] {
        width: 100%;
        max-width: 430px;
        display: flex;
        justify-content: center;
      }

      [data-app="device"] {
        width: 100%;
        max-width: 430px;
        background: #2b2150;
        border-radius: clamp(30px, 10vw, 48px);
        padding: min(14px, 3.4vw);
        box-shadow: 0 24px 54px rgba(43, 33, 80, 0.32);
      }

      /* The only override on a node that keeps its inline style, so it needs
         the !important the three rules above avoid by dropping theirs. */
      [data-app="screen"] {
        border-radius: clamp(22px, 8vw, 36px) !important;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="boot-error">
        Lai spēlētu Prāta Piedzīvojumu Salu, pārlūkā jābūt ieslēgtam JavaScript.
      </div>
    </noscript>

    <script>
      (async () => {
        const sourceUrl = "./Prata%20Sala.dc.html";
        const response = await fetch(sourceUrl);

        if (!response.ok) {
          throw new Error(`Neizdevās ielādēt spēli: ${response.status}`);
        }

        const source = await response.text();
        const sourceDoc = new DOMParser().parseFromString(source, "text/html");
        const sourceDc = sourceDoc.querySelector("x-dc");
        const sourceLogic = sourceDoc.querySelector("script[data-dc-script]");

        if (!sourceDc || !sourceLogic) {
          throw new Error("Spēles eksportā trūkst nepieciešamā x-dc satura.");
        }

        // The export is a design board: style comparisons, headings, and one
        // playable phone. Select by data-app hook rather than child index so
        // rearranging the board can't silently mount the wrong subtree.
        const page = sourceDc.querySelector('[data-app="page"]');
        const playableFrame = sourceDc.querySelector('[data-app="frame"]');

        if (!page || !playableFrame) {
          throw new Error("Spēles sākuma ekrānu neizdevās sagatavot.");
        }

        // Drop the annotations, keep the phone. These three carry board-layout
        // inline styles that only make sense on the board; clearing them hands
        // layout to the [data-app] rules in this file's stylesheet.
        page.replaceChildren(playableFrame);
        page.removeAttribute("style");
        playableFrame.removeAttribute("style");
        playableFrame.querySelector('[data-app="device"]')?.removeAttribute("style");

        const dc = sourceDc.cloneNode(true);
        document.body.appendChild(dc);

        const logic = document.createElement("script");
        logic.type = "text/x-dc";
        logic.setAttribute("data-dc-script", "");
        logic.setAttribute(
          "data-props",
          sourceLogic.getAttribute("data-props") || "{}"
        );
        logic.textContent = sourceLogic.textContent || "";
        document.body.appendChild(logic);

        const runtime = document.createElement("script");
        runtime.src = "./support.js";
        document.head.appendChild(runtime);
      })().catch((error) => {
        console.error(error);
        document.body.innerHTML =
          '<div class="boot-error">Spēli pašlaik neizdevās ielādēt. Pārbaudi, vai visi faili ir augšupielādēti kopā.</div>';
      });
    </script>
  </body>
</html>
