<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Prāta Piedzīvojumu Sala - bērnu attīstības mini spēļu sala"
    />
    <!-- Since React, Babel and the fonts were vendored into ./vendor and
         ./shared, this app makes no third-party requests at all and the policy
         can say so. 'unsafe-eval' and 'unsafe-inline' are unavoidable and not
         incidental: support.js is a design-board runtime that compiles the
         game with Babel and evaluates it through `new Function`, and every
         element in "Prata Sala.dc.html" is styled with a style attribute.
         With those keywords present script-src stops approximately nothing —
         it is here for the origin restriction, not as an XSS defence.

         What still does real work: connect-src, img-src and font-src pinned to
         'self' leave injected code nowhere to send data, and
         object-src/base-uri/form-action close the usual side doors.

         frame-ancestors is deliberately absent — browsers ignore it in a
         <meta> policy and log an error, and GitHub Pages cannot set headers. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#dceaf7" />
    <!-- Without this the browser falls back to requesting /favicon.ico, which
         does not exist here and 404'd on every load. -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Prāta Piedzīvojumu Sala</title>
    <!-- KidMindPath design system. This is what makes the "Nunito" below an
         actual font: the family was named here from the start, but nothing
         ever loaded it, so the game shipped in whatever generic sans-serif the
         device happened to pick. -->
    <link rel="stylesheet" href="./shared/kidmindpath-fonts.css" />
    <link rel="stylesheet" href="./shared/kidmindpath-tokens.css" />
    <link rel="stylesheet" href="./shared/kidmindpath-ui.css" />
    <!-- Classic script. Must load before the game: "Prata Sala.dc.html"
         reads window.KMP at module scope to namespace SAVE_KEY. -->
    <script src="./shared/kmp.js"></script>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        overflow-x: hidden;
        background: #dceaf7;
      }

      body {
        min-width: 320px;
        /* The game sets its own font on [data-app="screen"], so this changes
           nothing visible today. Without it, though, <body> inherits the
           browser default, and anything that ever renders outside the screen
           element lands in Times New Roman. */
        font-family: var(--kmp-font-body);
      }

      .boot-error {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #34245c;
        font: 700 18px/1.35 var(--kmp-font-display);
        text-align: center;
      }

      /* The design board wraps the playable phone in a page of annotations and
         a mock device bezel. index.html keeps only the screen and gives it the
         whole viewport — position:fixed sidesteps the entire wrapper chain
         (page -> frame -> device -> themeVars), so none of those need styling
         at all. Custom properties still inherit through a fixed element, so
         --sky-top and --u (from "Prata Sala.dc.html") keep working. */
      [data-app="screen"] {
        position: fixed;
        /* The KidMindPath bar is fixed over the top of the viewport, so the
           screen has to start below it. --kmp-bar-h is published by
           shared/kmp.js and is 0 when there is no bar. */
        inset: var(--kmp-bar-h, 0px) 0 0 0;
        overflow: hidden;
        font-family: var(--kmp-font-body);
        /* the theme's sky colour, so a notch or home-indicator inset blends in
           instead of showing white */
        background: var(--sky-top, #dceaf7);
        /* screens inside are position:absolute inset:0, and absolute children
           resolve against the padding box — so this keeps content clear of the
           notch and home indicator */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="boot-error">
        Lai spēlētu Prāta Piedzīvojumu Salu, pārlūkā jābūt ieslēgtam JavaScript.
      </div>
    </noscript>

    <script>
      (async () => {
        const sourceUrl = "./Prata%20Sala.dc.html";
        const response = await fetch(sourceUrl);

        if (!response.ok) {
          throw new Error(`Neizdevās ielādēt spēli: ${response.status}`);
        }

        const source = await response.text();
        const sourceDoc = new DOMParser().parseFromString(source, "text/html");
        const sourceDc = sourceDoc.querySelector("x-dc");
        const sourceLogic = sourceDoc.querySelector("script[data-dc-script]");

        if (!sourceDc || !sourceLogic) {
          throw new Error("Spēles eksportā trūkst nepieciešamā x-dc satura.");
        }

        // The export is a design board: style comparisons, headings, and one
        // playable phone. Select by data-app hook rather than child index so
        // rearranging the board can't silently mount the wrong subtree.
        const page = sourceDc.querySelector('[data-app="page"]');
        const playableFrame = sourceDc.querySelector('[data-app="frame"]');

        if (!page || !playableFrame) {
          throw new Error("Spēles sākuma ekrānu neizdevās sagatavot.");
        }

        // Drop the annotations, keep the screen. These all carry board-layout
        // inline styles that only make sense on the board — the bezel, the
        // 430px frame, the 9:16 aspect ratio and rounded corners. Clearing them
        // hands layout to the [data-app] rules in this file's stylesheet.
        page.replaceChildren(playableFrame);
        page.removeAttribute("style");
        playableFrame.removeAttribute("style");
        for (const hook of ["device", "screen"]) {
          playableFrame
            .querySelector(`[data-app="${hook}"]`)
            ?.removeAttribute("style");
        }

        const dc = sourceDc.cloneNode(true);
        document.body.appendChild(dc);

        const logic = document.createElement("script");
        logic.type = "text/x-dc";
        logic.setAttribute("data-dc-script", "");
        logic.setAttribute(
          "data-props",
          sourceLogic.getAttribute("data-props") || "{}"
        );
        logic.textContent = sourceLogic.textContent || "";
        document.body.appendChild(logic);

        const runtime = document.createElement("script");
        runtime.src = "./support.js";
        document.head.appendChild(runtime);

        // The bar back to the hub. Its onLeave flushes progress, because this
        // game saves at round boundaries rather than continuously and the bar
        // leaves on a plain tap — see componentDidMount in the board export,
        // which publishes __prataSaveProgress.
        try {
          window.KMP &&
            window.KMP.homeBar({
              appId: "PrataSala",
              title: "Prāta Sala",
              onLeave: () => window.__prataSaveProgress && window.__prataSaveProgress(),
            });
        } catch (error) {
          console.error("kmp: bar failed to mount", error);
        }
      })().catch((error) => {
        console.error(error);
        document.body.innerHTML =
          '<div class="boot-error">Spēli pašlaik neizdevās ielādēt. Pārbaudi, vai visi faili ir augšupielādēti kopā.</div>';
      });
    </script>
  </body>
</html>
