<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Prāta Piedzīvojumu Sala - bērnu attīstības mini spēļu sala"
    />
    <title>Prāta Piedzīvojumu Sala</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        overflow-x: hidden;
        background: #dceaf7;
      }

      body {
        min-width: 320px;
      }

      .boot-error {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #34245c;
        font: 800 18px/1.35 system-ui, sans-serif;
        text-align: center;
      }

      /* The design board wraps the playable phone in a page of annotations and
         a mock device bezel. index.html keeps only the screen and gives it the
         whole viewport — position:fixed sidesteps the entire wrapper chain
         (page -> frame -> device -> themeVars), so none of those need styling
         at all. Custom properties still inherit through a fixed element, so
         --sky-top and --u (from "Prata Sala.dc.html") keep working. */
      [data-app="screen"] {
        position: fixed;
        inset: 0;
        overflow: hidden;
        font-family: "Nunito", sans-serif;
        /* the theme's sky colour, so a notch or home-indicator inset blends in
           instead of showing white */
        background: var(--sky-top, #dceaf7);
        /* screens inside are position:absolute inset:0, and absolute children
           resolve against the padding box — so this keeps content clear of the
           notch and home indicator */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="boot-error">
        Lai spēlētu Prāta Piedzīvojumu Salu, pārlūkā jābūt ieslēgtam JavaScript.
      </div>
    </noscript>

    <script>
      (async () => {
        const sourceUrl = "./Prata%20Sala.dc.html";
        const response = await fetch(sourceUrl);

        if (!response.ok) {
          throw new Error(`Neizdevās ielādēt spēli: ${response.status}`);
        }

        const source = await response.text();
        const sourceDoc = new DOMParser().parseFromString(source, "text/html");
        const sourceDc = sourceDoc.querySelector("x-dc");
        const sourceLogic = sourceDoc.querySelector("script[data-dc-script]");

        if (!sourceDc || !sourceLogic) {
          throw new Error("Spēles eksportā trūkst nepieciešamā x-dc satura.");
        }

        // The export is a design board: style comparisons, headings, and one
        // playable phone. Select by data-app hook rather than child index so
        // rearranging the board can't silently mount the wrong subtree.
        const page = sourceDc.querySelector('[data-app="page"]');
        const playableFrame = sourceDc.querySelector('[data-app="frame"]');

        if (!page || !playableFrame) {
          throw new Error("Spēles sākuma ekrānu neizdevās sagatavot.");
        }

        // Drop the annotations, keep the screen. These all carry board-layout
        // inline styles that only make sense on the board — the bezel, the
        // 430px frame, the 9:16 aspect ratio and rounded corners. Clearing them
        // hands layout to the [data-app] rules in this file's stylesheet.
        page.replaceChildren(playableFrame);
        page.removeAttribute("style");
        playableFrame.removeAttribute("style");
        for (const hook of ["device", "screen"]) {
          playableFrame
            .querySelector(`[data-app="${hook}"]`)
            ?.removeAttribute("style");
        }

        const dc = sourceDc.cloneNode(true);
        document.body.appendChild(dc);

        const logic = document.createElement("script");
        logic.type = "text/x-dc";
        logic.setAttribute("data-dc-script", "");
        logic.setAttribute(
          "data-props",
          sourceLogic.getAttribute("data-props") || "{}"
        );
        logic.textContent = sourceLogic.textContent || "";
        document.body.appendChild(logic);

        const runtime = document.createElement("script");
        runtime.src = "./support.js";
        document.head.appendChild(runtime);
      })().catch((error) => {
        console.error(error);
        document.body.innerHTML =
          '<div class="boot-error">Spēli pašlaik neizdevās ielādēt. Pārbaudi, vai visi faili ir augšupielādēti kopā.</div>';
      });
    </script>
  </body>
</html>
